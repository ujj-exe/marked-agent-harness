[project]
name = "marked-agent-harness"
version = "0.1.0"
description = "Local provider, OpenAI Codex auth, and onboarding support for the Marked agent harness"
requires-python = ">=3.11,<3.15"
dependencies = ["aiohttp==3.11.18", "questionary>=2.1,<3"]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.9"]

[project.scripts]
marked = "market_data.onboarding:main"
marked-onboard = "market_data.onboarding:main"
marked-auth = "market_data.agent_auth:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
