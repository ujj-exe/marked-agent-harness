[project]
name = "marked-agent-harness"
version = "0.2.0"
description = "Local provider, OpenAI Codex auth, and onboarding support for the Marked agent harness"
requires-python = ">=3.11,<3.15"
license = "AGPL-3.0-only"
dependencies = [
    "aiohttp==3.11.18",
]

[dependency-groups]
dev = ["pytest==8.4.2", "pytest-asyncio==1.2.0", "ruff==0.14.9"]

[project.scripts]
marked-auth = "market_data.agent_auth:main"
marked-codex = "market_data.codex_runtime:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/market_data"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
